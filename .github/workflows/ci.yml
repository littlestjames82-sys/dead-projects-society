name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test suite
        run: python -m unittest discover -s tests -v

  site:
    # The web graveyard ships no Python: validate its checked-in
    # data files parse, its scripts parse, and the bury-a-user
    # logic passes its standalone node checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate site JSON
        run: python tools/check_site_json.py
      - name: Syntax-check site scripts
        run: |
          node --check site/main.js
          node --check site/bury.js
      - name: Bury-a-user logic checks
        run: node tests/bury.test.js

  test-legacy:
    # Python 3.9 is no longer installable on the newest runner images;
    # it gets its own job on an older image so the 3.9 floor stays honest.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Test suite
        run: python -m unittest discover -s tests -v
