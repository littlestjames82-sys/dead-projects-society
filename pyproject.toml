[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dead-projects-society"
version = "0.2.0"
description = "A funeral for your abandoned side projects: tombstones, causes of death, and the successor that replaced them, from git history alone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["git", "cli", "side-projects", "developer-tools", "fun"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/littlestjames82-sys/dead-projects-society"
Repository = "https://github.com/littlestjames82-sys/dead-projects-society"

[project.scripts]
dead-projects-society = "dead_projects_society:main"

[tool.setuptools]
py-modules = ["dead_projects_society"]
